<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Gouvernement Idéal - Daruma</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Dancing+Script:wght@700&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #002366 33%, #ffffff 34% 66%, #ce1126 67%);
      min-height: 100vh;
    }
    .container {
      max-width: 1150px; margin: 0 auto; background: #f5f5f5;
      min-height: 100vh; display: flex; flex-direction: column;
      position: relative; z-index: 1;
    }
    header {
      width: 100%; height: 280px;
      background: white url('https://github.com/gorillaz-2102/Political-Severance/raw/main/header_banner.jpg') top center no-repeat;
      background-size: contain; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
    }
    h1 { font-family: 'Dancing Script', cursive; color: #002366; font-size: 3.5em; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
    
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px; padding: 30px; flex-grow: 1;
    }
    .card {
      background: white; border-radius: 12px; padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #002366;
      display: flex; flex-direction: column; align-items: center; transition: 0.3s;
    }
    .card:hover { transform: translateY(-5px); }
    .role-name { font-family: 'Roboto Condensed', sans-serif; font-size: 1.1em; margin-bottom: 15px; color: #333; text-align: center; height: 45px; font-weight: bold; }
    
    .search-box { width: 100%; display: flex; gap: 5px; margin-bottom: 10px; }
    input { flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; background: #002366; color: white; font-weight: bold; }
    button:hover { background: #ce1126; }

    .result-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-top: 10px; border: 2px solid #eee; display: none; }
    
    .wiki-link-active {
      color: #002366;
      text-decoration: underline;
      font-weight: bold;
      margin-top: 5px;
      font-size: 0.9em;
    }

    /* Section Tendances */
    .trends-section {
      padding: 30px;
      background: #fff;
      border-top: 5px solid #ce1126;
      margin: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .trends-section h2 {
      font-family: 'Roboto Condensed', sans-serif;
      color: #002366;
      margin-top: 0;
      text-align: center;
      text-transform: uppercase;
    }
    .trends-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      list-style: none;
      padding: 0;
    }
    .trend-item {
      background: #f0f4f8;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.9em;
      color: #333;
      border: 1px solid #d1d9e6;
    }
    .trend-item b { color: #ce1126; }

    .footer-actions { padding: 30px; text-align: center; background: #eee; border-top: 2px solid #ddd; }
    #validerBtn { padding: 15px 40px; font-size: 1.2em; background: #28a745; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    #validerBtn:hover { background: #218838; transform: scale(1.05); }

    /* Overlay Popup */
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .popup { background: white; padding: 30px; border-radius: 10px; max-width: 500px; width: 90%; text-align: center; }
    textarea { width: 100%; height: 80px; margin: 15px 0; padding: 10px; border-radius: 5px; border: 1px solid #ccc; resize: none; }
    .popup-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Mon Gouvernement Idéal</h1>
    </header>

    <div id="government-grid" class="grid"></div>

    <div class="trends-section">
      <h2>🔥 Personnalités les plus choisies</h2>
      <div id="trends-loading" style="text-align:center; color:#666;">Chargement des tendances...</div>
      <ul id="trends-list" class="trends-list"></ul>
    </div>

    <div class="footer-actions">
      <button id="validerBtn">🇫🇷 VALIDER MON GOUVERNEMENT</button>
    </div>
  </div>

  <div id="overlay">
    <div class="popup">
      <h2>Gouvernement Prêt !</h2>
      <p>Partagez votre équipe avec ce lien :</p>
      <textarea id="generatedLink" readonly></textarea>
      <div class="popup-btns">
        <button id="copyLinkBtn">Copier le lien</button>
        <button id="goToTableBtn" style="background:#002366; color:white; padding: 10px 20px; border:none; border-radius:4px; cursor:pointer;">Voir le Tableau</button>
        <button id="closePopup" style="background:#aaa; color:white; padding: 10px 20px; border:none; border-radius:4px; cursor:pointer;">Fermer</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Utilisation de la configuration globale fournie par l'environnement pour éviter les erreurs de referer
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "AIzaSyD6SEEWeN36C1_aJN6BWsmJU-YXCfwQc7g",
          authDomain: "severance-2025.firebaseapp.com",
          projectId: "severance-2025",
          appId: "1:915954379713:web:cc42c4f1c95e4b24b25d40"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'severance-2025';

    const fonctions = [
      { id: 1, titre: "Président de la République", personne: null },
      { id: 2, titre: "Premier Ministre", personne: null },
      { id: 3, titre: "Ministre de l'Intérieur", personne: null },
      { id: 4, titre: "Ministre de la Justice", personne: null },
      { id: 5, titre: "Ministre des Affaires Étrangères", personne: null },
      { id: 6, titre: "Ministre des Armées", personne: null },
      { id: 7, titre: "Ministre de l'Éducation Nationale", personne: null },
      { id: 8, titre: "Ministre de l'Économie et des Finances", personne: null },
      { id: 9, titre: "Ministre de la Santé", personne: null },
      { id: 10, titre: "Ministre de l'Environnement", personne: null },
      { id: 11, titre: "Ministre de la Culture", personne: null },
      { id: 12, titre: "Ministre de l'Agriculture", personne: null },
      { id: 13, titre: "Ministre du Travail", personne: null },
      { id: 14, titre: "Ministre des Outre-mer", personne: null },
      { id: 15, titre: "Ministre des Sports", personne: null }
    ];

    const grid = document.getElementById("government-grid");

    function renderGrid() {
      grid.innerHTML = "";
      fonctions.forEach(f => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="role-name">${f.titre}</div>
          <div class="search-box">
            <input type="text" id="input-${f.id}" placeholder="Chercher sur Wikipédia..." onkeypress="if(event.key==='Enter') window.searchWiki(${f.id})">
            <button onclick="window.searchWiki(${f.id})">🔍</button>
          </div>
          <img id="img-${f.id}" class="result-img">
          <div id="nom-${f.id}" style="text-align:center;"></div>
        `;
        grid.appendChild(card);
      });
    }

    window.searchWiki = async (id) => {
      const query = document.getElementById(`input-${id}`).value;
      if (!query) return;

      try {
        const response = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
        const data = await response.json();
        
        const personne = {
          nom: data.title,
          image: data.thumbnail ? data.thumbnail.source : 'https://via.placeholder.com/80',
          url: data.content_urls.desktop.page
        };

        const index = fonctions.findIndex(f => f.id === id);
        fonctions[index].personne = personne;

        const img = document.getElementById(`img-${id}`);
        img.src = personne.image;
        img.style.display = "block";
        
        const nomContainer = document.getElementById(`nom-${id}`);
        nomContainer.innerHTML = `<a href="${personne.url}" target="_blank" class="wiki-link-active">${personne.nom} 🔗</a>`;
      } catch (e) { alert("Personne non trouvée sur Wikipédia."); }
    };

    async function loadTrends() {
      try {
        // RÈGLE 3 : Authentification via jeton personnalisé ou anonyme
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        const user = auth.currentUser;
        if (!user) return;

        // RÈGLE 1 : Chemin strict pour les données publiques
        const statsCol = collection(db, 'artifacts', appId, 'public', 'data', 'stats_globales');
        const snap = await getDocs(statsCol);
        
        const allStats = [];
        snap.forEach(docSnap => allStats.push(docSnap.data()));

        // RÈGLE 2 : Tri en mémoire locale pour éviter les index complexes
        allStats.sort((a, b) => (b.votes || 0) - (a.votes || 0));
        const top10 = allStats.slice(0, 10);

        const list = document.getElementById("trends-list");
        document.getElementById("trends-loading").style.display = "none";
        list.innerHTML = "";

        top10.forEach(item => {
          const li = document.createElement("li");
          li.className = "trend-item";
          li.innerHTML = `${item.nom} (<b>${item.votes || 0}</b>)`;
          list.appendChild(li);
        });
      } catch (err) {
        console.error("Erreur tendances:", err);
        document.getElementById("trends-loading").innerText = "Tendances indisponibles.";
      }
    }

    document.getElementById("validerBtn").onclick = () => {
      const params = new URLSearchParams();
      let hasData = false;
      fonctions.forEach(f => {
        if (f.personne) {
          params.append(f.titre, JSON.stringify(f.personne));
          hasData = true;
        }
      });

      if(!hasData) return alert("Veuillez sélectionner au moins un membre.");

      const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');
      const separator = baseUrl.endsWith('/') ? '' : '/';
      const finalUrl = `${baseUrl}${separator}tableau.html?${params.toString()}`;
      
      document.getElementById("generatedLink").value = finalUrl;
      document.getElementById("overlay").style.display = "flex";
    };

    document.getElementById("closePopup").onclick = () => document.getElementById("overlay").style.display = "none";
    document.getElementById("copyLinkBtn").onclick = () => {
      document.getElementById("generatedLink").select();
      document.execCommand("copy");
      alert("Lien copié !");
    };
    document.getElementById("goToTableBtn").onclick = () => window.location.href = document.getElementById("generatedLink").value;

    renderGrid();
    loadTrends();
  </script>
</body>
</html>
