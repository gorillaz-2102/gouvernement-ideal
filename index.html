<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daruma - Mon Gouvernement Idéal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Dancing+Script:wght@700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(to right, #002366 33%, #ffffff 34% 66%, #ce1126 67%); min-height: 100vh; }
    .container { max-width: 1150px; margin: 0 auto; background: #f5f5f5; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
    header { width: 100%; height: 200px; background: #fff; display: flex; justify-content: center; align-items: center; text-align: center; border-bottom: 5px solid #002366; }
    h1 { font-family: 'Dancing Script', cursive; color: #002366; font-size: 3.5em; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 30px; flex-grow: 1; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid #002366; display: flex; flex-direction: column; align-items: center; }
    .role-name { font-family: 'Roboto Condensed', sans-serif; font-size: 1.1em; margin-bottom: 15px; color: #333; text-align: center; height: 40px; font-weight: bold; }
    .search-box { width: 100%; display: flex; gap: 5px; margin-bottom: 10px; }
    input { flex-grow: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; background: #002366; color: white; font-weight: bold; }
    button:hover { background: #ce1126; }
    .result-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-top: 10px; border: 2px solid #eee; display: none; }
    .footer-actions { padding: 40px; text-align: center; background: #eee; }
    #validerBtn { padding: 15px 40px; font-size: 1.2em; background: #28a745; color: white; border-radius: 50px; transition: 0.3s; cursor: pointer; border: none; font-weight: bold; }
    #validerBtn:hover { background: #218838; transform: scale(1.05); }
    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .popup { background: white; padding: 30px; border-radius: 10px; max-width: 500px; width: 90%; text-align: center; }
    textarea { width: 100%; height: 80px; margin: 15px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; resize: none; }
  </style>
</head>
<body>

  <div class="container">
    <header><h1>Mon Gouvernement Idéal</h1></header>
    <div id="government-grid" class="grid"></div>
    <div class="footer-actions"><button id="validerBtn">🇫🇷 VALIDER MON GOUVERNEMENT</button></div>
  </div>

  <div id="overlay">
    <div class="popup">
      <h2>Gouvernement Prêt !</h2>
      <p>Partagez votre équipe avec ce lien :</p>
      <textarea id="generatedLink" readonly></textarea>
      <br>
      <button id="copyLinkBtn">Copier le lien</button>
      <button id="goToTableBtn" style="background:#002366">Voir le Tableau</button>
      <button id="closePopup" style="background:#aaa">Fermer</button>
    </div>
  </div>

  <script type="module">
    const fonctions = [
      "Président de la République", "Premier Ministre", "Ministre de l'Intérieur", 
      "Ministre de la Justice", "Ministre des Affaires Étrangères", "Ministre des Armées",
      "Ministre de l'Éducation", "Ministre de l'Économie", "Ministre de la Santé"
    ].map((titre, i) => ({ id: i, titre, personne: null }));

    const grid = document.getElementById("government-grid");

    function renderGrid() {
      grid.innerHTML = "";
      fonctions.forEach(f => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="role-name">${f.titre}</div>
          <div class="search-box">
            <input type="text" id="input-${f.id}" placeholder="Nom du ministre..." onkeypress="if(event.key==='Enter') window.searchWiki(${f.id})">
            <button onclick="window.searchWiki(${f.id})">🔍</button>
          </div>
          <img id="img-${f.id}" class="result-img">
          <div id="nom-${f.id}" style="font-weight:bold; margin-top:5px; color:#002366"></div>
        `;
        grid.appendChild(card);
      });
    }

    window.searchWiki = async (id) => {
      const query = document.getElementById(`input-${id}`).value;
      if (!query) return;
      try {
        const response = await fetch(`https://fr.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
        const data = await response.json();
        const personne = {
          nom: data.title,
          image: data.thumbnail ? data.thumbnail.source : 'https://via.placeholder.com/80',
          url: data.content_urls.desktop.page
        };
        fonctions[id].personne = personne;
        document.getElementById(`img-${id}`).src = personne.image;
        document.getElementById(`img-${id}`).style.display = "block";
        document.getElementById(`nom-${id}`).innerText = personne.nom;
      } catch (e) { alert("Introuvable sur Wikipédia"); }
    };

    document.getElementById("validerBtn").onclick = () => {
      const params = new URLSearchParams();
      fonctions.forEach(f => {
        if(f.personne) params.append(f.titre, JSON.stringify(f.personne));
      });
      
      const baseUrl = window.location.href.split('index.html')[0].split('?')[0];
      const finalUrl = `${baseUrl}${baseUrl.endsWith('/')?'':'/'}tableau.html?${params.toString()}`;
      
      document.getElementById("generatedLink").value = finalUrl;
      document.getElementById("overlay").style.display = "flex";
    };

    document.getElementById("closePopup").onclick = () => document.getElementById("overlay").style.display = "none";
    document.getElementById("copyLinkBtn").onclick = () => {
      document.getElementById("generatedLink").select();
      document.execCommand("copy");
      alert("Lien copié !");
    };
    document.getElementById("goToTableBtn").onclick = () => window.location.href = document.getElementById("generatedLink").value;

    renderGrid();
  </script>
</body>
</html>
