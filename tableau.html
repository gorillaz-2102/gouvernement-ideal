<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Daruma - Tableau de Bord</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&family=Dancing+Script:wght@700&display=swap');
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(to right, #002366 33%, #ffffff 34% 66%, #ce1126 67%); min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 20px auto; background: #f5f5f5; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    h1 { font-family: 'Dancing Script', cursive; color: #002366; text-align: center; font-size: 3em; margin: 0; }
    h2 { font-family: 'Roboto Condensed', sans-serif; border-bottom: 3px solid #ce1126; padding-bottom: 5px; margin-top: 30px; color: #333; }
    table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #002366; color: white; }
    .wiki-link { color: #002366; font-weight: bold; text-decoration: none; }
    .return-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #ce1126; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Daruma</h1>
    <h2>Votre Gouvernement</h2>
    <table id="table-fonctions">
      <thead><tr><th>Ministère</th><th>Titulaire</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2>Top 10 Global (Firebase)</h2>
    <table id="table-populaires">
      <thead><tr><th>Personnalité</th><th>Votes</th></tr></thead>
      <tbody></tbody>
    </table>
    <a class="return-btn" href="index.html">⬅ Nouveau gouvernement</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, increment, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6SEEWeN36C1_aJN6BWsmJU-YXCfwQc7g",
      authDomain: "severance-2025.firebaseapp.com",
      projectId: "severance-2025",
      appId: "1:915954379713:web:cc42c4f1c95e4b24b25d40"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const params = new URLSearchParams(window.location.search);

    async function init() {
      const tbodyLocal = document.querySelector("#table-fonctions tbody");
      
      // 1. Affichage et Sauvegarde
      for (const [ministere, dataJson] of params) {
        try {
          const personne = JSON.parse(dataJson);
          // Affichage
          const tr = document.createElement("tr");
          tr.innerHTML = `<td><b>${ministere}</b></td><td><a class="wiki-link" href="${personne.url}" target="_blank">${personne.nom} 🔗</a></td>`;
          tbodyLocal.appendChild(tr);

          // Sauvegarde Firebase (si pas déjà voté dans cette session)
          if (!localStorage.getItem(`voted_${personne.nom}`)) {
            await setDoc(doc(db, "stats_globales", personne.nom), { nom: personne.nom, votes: increment(1) }, { merge: true });
            localStorage.setItem(`voted_${personne.nom}`, "true");
          }
        } catch(e) { console.error("Erreur donnée:", e); }
      }

      // 2. Chargement Top 10
      const q = query(collection(db, "stats_globales"), orderBy("votes", "desc"), limit(10));
      const snap = await getDocs(q);
      const tbodyGlobal = document.querySelector("#table-populaires tbody");
      snap.forEach(doc => {
        const d = doc.data();
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${d.nom}</td><td><b>${d.votes}</b> sélections</td>`;
        tbodyGlobal.appendChild(tr);
      });
    }

    init();
  </script>
</body>
</html>
